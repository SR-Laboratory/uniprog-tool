name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GPL release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches central version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $versionText = Get-Content version.toml -Raw
          $centralVersion = [regex]::Match(
            $versionText,
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if ("v$centralVersion" -ne $tag) {
            throw "tag '$tag' does not match version.toml version '$centralVersion'"
          }

      - name: Validate all version files are in sync
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Rust verify (fmt/check/clippy/test)
        run: npm run verify:libusb

      - name: Build GPL libusb release
        run: npm run dist:libusb -- --skip-smoke

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            dist/desktop-tauri-libusb/installer/*-setup.exe
            dist/desktop-tauri-libusb/portable/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
