# Chiplib source manifest.
#
# `order` controls the protocol order in the compiled database. `sources`
# maps each protocol tag to its TOML source under `flashdb/`. The assembler
# compiles these files directly into the runtime chiplib.bin.
[chipdb]
order = [
  "SPI_EC",
  "SPI_DATA_45",
  "SPI_NAND",
  "SPI_NOR",
  "SPI_EEPROM",
  "SPI_F-RAM",
  "I2C",
  "I2C_F-RAM",
  "I2C_SPD",
  "Microwire",
  "AVR",
  "MCU",
  "PARALLEL_NAND",
]

[chipdb.sources]
SPI_EC = "protocols/spi-ec.toml"
SPI_DATA_45 = "protocols/spi-data45.toml"
SPI_NAND = "protocols/spi-nand.toml"
SPI_NOR = "protocols/spi-nor.toml"
SPI_EEPROM = "protocols/spi-eeprom.toml"
SPI_F-RAM = "protocols/spi-fram.toml"
I2C = "protocols/i2c.toml"
I2C_F-RAM = "protocols/i2c-fram.toml"
I2C_SPD = "protocols/i2c-spd.toml"
Microwire = "protocols/microwire.toml"
AVR = "protocols/avr.toml"
MCU = "protocols/mcu.toml"
PARALLEL_NAND = "protocols/parallel-nand.toml"
