# Chiplib source manifest.
#
# `order` controls the merged XML layout. `sources` maps each protocol tag
# to its fragment file under `flashdb/`. The assembler merges these fragments
# into the generated workspace; never edit a generated chiplib.xml by hand.
[chipdb]
order = [
  "SPI_EC",
  "SPI_DATA_45",
  "SPI_NAND",
  "SPI_NOR",
  "SPI_EEPROM",
  "SPI_F-RAM",
  "I2C",
  "I2C_F-RAM",
  "I2C_SPD",
  "Microwire",
  "AVR",
  "MCU",
  "PARALLEL_NAND",
]

[chipdb.sources]
SPI_EC = "protocols/spi-ec.xml"
SPI_DATA_45 = "protocols/spi-data45.xml"
SPI_NAND = "protocols/spi-nand.xml"
SPI_NOR = "protocols/spi-nor.xml"
SPI_EEPROM = "protocols/spi-eeprom.xml"
SPI_F-RAM = "protocols/spi-fram.xml"
I2C = "protocols/i2c.xml"
I2C_F-RAM = "protocols/i2c-fram.xml"
I2C_SPD = "protocols/i2c-spd.xml"
Microwire = "protocols/microwire.xml"
AVR = "protocols/avr.xml"
MCU = "protocols/mcu.xml"
PARALLEL_NAND = "protocols/parallel-nand.xml"
